# ApolloStorage runtime configuration (design D8).
# Every deployment-varying value is overridable by an environment variable;
# no secrets are committed here.

include "serialization"
include "persistence"
include "cluster"

apollostorage {
  http {
    host = "0.0.0.0"
    host = ${?HTTP_HOST}
    port = 8080
    port = ${?HTTP_PORT}
  }

  blob {
    # Which backend stores object payloads (add-s3-backend-and-rest-api):
    #   filesystem — local/NFS disk under `root` (default; good for local dev)
    #   s3         — an S3-compatible store (e.g. the QNAP's QuObjects) per the `s3` block below
    backend = "filesystem"
    backend = ${?BLOB_BACKEND}

    # Filesystem backend: root directory for object payloads (mount persistent storage here).
    root = "/var/lib/apollostorage/objects"
    root = ${?BLOB_STORE_PATH}

    # S3 backend connection. Credentials are secrets — supply via env, never commit them.
    s3 {
      endpoint = ""
      endpoint = ${?S3_ENDPOINT}          # e.g. https://mimir.example:8010
      region = "us-east-1"
      region = ${?S3_REGION}
      bucket = ""
      bucket = ${?S3_BUCKET}
      # S3-compatible stores (QuObjects, MinIO) need path-style addressing, not virtual-host.
      path-style = true
      path-style = ${?S3_PATH_STYLE}
      access-key = ""
      access-key = ${?S3_ACCESS_KEY}
      secret-key = ""
      secret-key = ${?S3_SECRET_KEY}
      # LAN-only escape hatch for a self-signed / hostname-mismatched endpoint cert. Prefer a
      # truststore in production; never enable tls-insecure on an internet-facing endpoint.
      tls-insecure = false
      tls-insecure = ${?S3_TLS_INSECURE}
      truststore-path = ""
      truststore-path = ${?S3_TRUSTSTORE_PATH}
      truststore-password = ""
      truststore-password = ${?S3_TRUSTSTORE_PASSWORD}
    }
  }

  db {
    # Apply the bundled (idempotent) schema at startup before serving (design D62-D66).
    # Set false to manage the schema externally; the DB user then needs no DDL rights.
    auto-migrate = true
    auto-migrate = ${?DB_AUTO_MIGRATE}
  }

  grpc {
    port = 8443
    port = ${?GRPC_PORT}
  }

  # API security (design D34-D39). Off by default so the image boots standalone;
  # enable both in production and supply the keystore + tokens as secrets.
  tls {
    enabled = false
    enabled = ${?TLS_ENABLED}
    keystore-path = ""
    keystore-path = ${?TLS_KEYSTORE_PATH}
    keystore-password = ""
    keystore-password = ${?TLS_KEYSTORE_PASSWORD}
  }
  auth {
    enabled = false
    enabled = ${?AUTH_ENABLED}
    # Comma-separated full-access (write) bearer tokens (secrets — supply via AUTH_TOKENS).
    tokens = ""
    tokens = ${?AUTH_TOKENS}
    # Scoped tokens (design D57): comma-separated `token:scope`, scope = read|write.
    # A token must not contain ':'. Example: AUTH_PRINCIPALS="backuptok:read,writetok:write".
    principals = ""
    principals = ${?AUTH_PRINCIPALS}
  }

  # Prometheus metrics (design D40-D44). On by default; the /metrics endpoint is
  # served on the HTTP port and is unauthenticated (no object data). Set to false
  # to disable collection and return 404.
  metrics {
    enabled = true
    enabled = ${?METRICS_ENABLED}
  }

  # Orphan-blob GC (design D50-D56). Off by default. When enabled, POST /admin/blob-gc
  # runs a reconciliation sweep (dry-run unless ?delete=true), gated by API auth when
  # auth is enabled. `grace` is the minimum age before an unreferenced blob is reclaimable
  # — keep it comfortably shorter than your backup retention.
  blob-gc {
    enabled = false
    enabled = ${?BLOB_GC_ENABLED}
    grace = 24 hours
    grace = ${?BLOB_GC_GRACE}
  }
}

pekko {
  loglevel = "INFO"
  loglevel = ${?LOG_LEVEL}
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"

  # gRPC is served over cleartext HTTP/2 (design D17).
  http.server.preview.enable-http2 = on

  # Run Coordinated Shutdown (and exit the JVM) on SIGTERM.
  coordinated-shutdown.run-by-jvm-shutdown-hook = on
  coordinated-shutdown.exit-jvm = on

  # actor.provider is set to "cluster" by cluster.conf (design D27).
}
