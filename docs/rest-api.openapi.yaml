openapi: 3.0.3
info:
  title: ApolloStorage REST object API
  version: "1.0"
  description: >-
    Plain RESTful bucket/object API served on the HTTP port alongside the gRPC ObjectApi
    (add-s3-backend-and-rest-api). A thin adapter over the same event-sourced core, so REST and gRPC
    share generations, checksums, and effects. Object metadata rides as `X-Apollo-*` response headers;
    bucket/list operations return JSON. When auth is enabled, a Bearer token is required — write scope
    for mutations, read scope for reads.
servers:
  # Relative first, so "try it out" from the built-in docs page targets the deployment you are
  # actually looking at (LAN, tailnet, or localhost) instead of a hard-coded host.
  - url: /
    description: This deployment (relative to the documentation page)
  - url: http://localhost:8080
    description: Local HTTP listener (cleartext on the LAN; TLS when TLS_ENABLED=true)
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        code: { type: string, example: OBJECT_NOT_FOUND }
        message: { type: string }
        correlationId: { type: string, description: The request's X-Correlation-Id }
    BucketList:
      type: object
      properties:
        buckets: { type: array, items: { type: string } }
        nextPageToken: { type: string }
    ObjectEntry:
      type: object
      properties:
        object: { type: string }
        generation: { type: integer, format: int64 }
        size: { type: integer, format: int64 }
        contentType: { type: string }
        crc32c: { type: string }
        md5: { type: string }
    ObjectList:
      type: object
      properties:
        objects: { type: array, items: { $ref: '#/components/schemas/ObjectEntry' } }
        nextPageToken: { type: string }
    Health:
      type: object
      properties:
        status: { type: string, enum: [UP, DOWN] }
        service: { type: string, example: apollostorage }
        version: { type: string, description: Build version }
    GcReport:
      type: object
      description: >-
        Blob-GC reconciliation report. `dryRun` is true unless the request passed `delete=true`;
        a dry run reports what it would reclaim without deleting anything.
      properties:
        dryRun: { type: boolean }
        bucketsScanned: { type: integer }
        bucketsSkipped: { type: integer }
        blobsScanned: { type: integer }
        liveBlobs: { type: integer }
        orphansFound: { type: integer }
        bytesOrphaned: { type: integer, format: int64 }
        reclaimed: { type: integer }
        bytesReclaimed: { type: integer, format: int64 }
        tmpFound: { type: integer }
        tmpReclaimed: { type: integer }
  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: { type: string }
      description: >-
        A validator previously received in an `ETag`. When it matches the object's current
        validator the server answers `304` with no body, resolved from metadata without reading
        the payload.
  headers:
    ETag:
      schema: { type: string }
      description: >-
        Strong validator for this representation, derived from the object's md5. Present on object
        `GET` and `HEAD`. Send it back as `If-None-Match` to revalidate cheaply.
    XApolloGeneration: { schema: { type: integer, format: int64 }, description: Object generation }
    XApolloSize: { schema: { type: integer, format: int64 }, description: Object size in bytes }
    XApolloCrc32c: { schema: { type: string } }
    XApolloMd5: { schema: { type: string } }
  responses:
    NotModified:
      description: >-
        The supplied validator matches the object's current one; the client's copy is still current.
        No body is returned and the payload is never read.
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
    NotFound:
      description: Bucket or object not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized: { description: Missing or unknown bearer token }
    Forbidden: { description: Token scope insufficient for the operation }
paths:
  /v1/buckets:
    get:
      summary: List buckets
      parameters:
        - { name: pageSize, in: query, schema: { type: integer } }
        - { name: pageToken, in: query, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BucketList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/buckets/{bucket}:
    parameters:
      - { name: bucket, in: path, required: true, schema: { type: string } }
    put:
      summary: Create a bucket
      responses:
        '201': { description: Created }
        '409': { description: Bucket already exists, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      summary: Delete a bucket
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/buckets/{bucket}/objects:
    parameters:
      - { name: bucket, in: path, required: true, schema: { type: string } }
    get:
      summary: List objects (read model; eventually consistent)
      parameters:
        - { name: prefix, in: query, schema: { type: string } }
        - { name: pageSize, in: query, schema: { type: integer } }
        - { name: pageToken, in: query, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ObjectList' } } } }
  /v1/buckets/{bucket}/objects/{object}:
    parameters:
      - { name: bucket, in: path, required: true, schema: { type: string } }
      - { name: object, in: path, required: true, schema: { type: string }, description: May contain '/' }
    put:
      summary: Upload an object (raw request body)
      requestBody:
        required: true
        content: { application/octet-stream: { schema: { type: string, format: binary } } }
      parameters:
        - { name: X-Apollo-Crc32c, in: header, schema: { type: string }, description: Expected crc32c (with X-Apollo-Md5, enforced) }
        - { name: X-Apollo-Md5, in: header, schema: { type: string } }
      responses:
        '201':
          description: Created
          headers:
            X-Apollo-Generation: { $ref: '#/components/headers/XApolloGeneration' }
            X-Apollo-Size: { $ref: '#/components/headers/XApolloSize' }
            X-Apollo-Crc32c: { $ref: '#/components/headers/XApolloCrc32c' }
            X-Apollo-Md5: { $ref: '#/components/headers/XApolloMd5' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ObjectEntry' } } }
        '412': { description: Expected-checksum mismatch, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      summary: Download an object (raw response body)
      description: >-
        Responses carry an `ETag` and `Cache-Control: private, no-cache` — an object path is
        mutable (an overwrite increments the generation at the same path), so a stored copy must be
        revalidated before reuse and is never marked immutable.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '304': { $ref: '#/components/responses/NotModified' }
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Apollo-Generation: { $ref: '#/components/headers/XApolloGeneration' }
            X-Apollo-Size: { $ref: '#/components/headers/XApolloSize' }
            X-Apollo-Crc32c: { $ref: '#/components/headers/XApolloCrc32c' }
            X-Apollo-Md5: { $ref: '#/components/headers/XApolloMd5' }
          content: { application/octet-stream: { schema: { type: string, format: binary } } }
        '404': { $ref: '#/components/responses/NotFound' }
    head:
      summary: Object metadata as headers (no body)
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '304': { $ref: '#/components/responses/NotModified' }
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Apollo-Generation: { $ref: '#/components/headers/XApolloGeneration' }
            X-Apollo-Size: { $ref: '#/components/headers/XApolloSize' }
            X-Apollo-Crc32c: { $ref: '#/components/headers/XApolloCrc32c' }
            X-Apollo-Md5: { $ref: '#/components/headers/XApolloMd5' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete an object
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /health:
    get:
      summary: Liveness / readiness
      description: >-
        Reports `UP` while the service is ready, and `DOWN` with a `503` once readiness is
        withdrawn during coordinated shutdown. Unauthenticated: it carries no object data, and a
        probe must work without a token.
      security: []
      responses:
        '200':
          description: Service is ready
          content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } }
        '503':
          description: Shutting down or not ready (body reports DOWN)
          content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } }
  /metrics:
    get:
      summary: Prometheus metrics
      description: >-
        Application metrics in Prometheus text exposition format. Deliberately unauthenticated —
        operational telemetry only, never object data. Absent (404) when metrics are disabled.
      security: []
      responses:
        '200':
          description: Text exposition payload
          content:
            text/plain:
              schema: { type: string }
        '404': { description: Metrics are disabled }
  /admin/blob-gc:
    post:
      summary: Run a blob-GC reconciliation sweep
      description: >-
        Reconciles stored blobs against the catalog and reports orphans. A **dry run** unless
        `delete=true` is passed, which makes the sweep destructive. Requires a write-scoped bearer
        token when auth is enabled. Absent (404) when blob GC is disabled.
      parameters:
        - name: delete
          in: query
          schema: { type: boolean, default: false }
          description: When true, actually delete the orphans found (destructive).
      responses:
        '200':
          description: Sweep report
          content: { application/json: { schema: { $ref: '#/components/schemas/GcReport' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Blob GC is disabled }
  /docs:
    get:
      summary: Interactive API documentation
      description: >-
        Swagger UI rendered against this document. Assets are served from the application's own
        classpath, so the page renders with no internet access. Unauthenticated and read-only.
      security: []
      responses:
        '200':
          description: The documentation page
          content: { text/html: { schema: { type: string } } }
  /docs/openapi.yaml:
    get:
      summary: This OpenAPI document
      description: >-
        The document backing the documentation page — the same artifact kept at
        `docs/rest-api.openapi.yaml`, packaged at build time. Unauthenticated and read-only.
      security: []
      responses:
        '200':
          description: The OpenAPI document
          content: { application/yaml: { schema: { type: string } } }
