name: CI

# Verifies every pull request targeting development or main: formatting,
# compilation, and the full test suite (unit + testcontainers integration).
# Merging is blocked unless all required checks pass (branch protection).
on:
  pull_request:
    branches: [development, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Resolving the Lexicon gRPC artifact from GitHub Packages needs authentication — an anonymous
# Maven read is a 401 even for a public package. It does NOT need a PAT: the `io.codex.lexicon-*`
# packages are public, and the Maven endpoint wants authentication, not authorization for the
# package's own repository, so the built-in GITHUB_TOKEN is enough. LEXICON_TOKEN still takes
# precedence in build.sbt when present, so a PAT remains an option but is no longer a requirement.
#
# This matters beyond tidiness: Dependabot pull_request events receive no repository secrets, so
# LEXICON_TOKEN is empty there and every bump PR failed to compile. They do get a GITHUB_TOKEN.
# No `permissions:` block here on purpose: the default grant already includes `packages: read`
# (confirmed in a run's GITHUB_TOKEN permissions listing), and adding a block would *restrict*
# every job to exactly what it lists — which risks breaking gitleaks for no gain.
env:
  # TEMPORARY, THIS COMMIT ONLY: blanked to force build.sbt's fallback (it filters empty values),
  # so this run proves GITHUB_TOKEN alone resolves the Lexicon artifact. Restored before merge.
  LEXICON_TOKEN: ""
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Formatting is a separate job so a scalafmt violation fails independently of
  # the tests (a green test suite must not mask a format failure).
  format:
    name: Format (scalafmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-scala
      - name: Check formatting
        run: sbt -batch scalafmtCheckAll scalafmtSbtCheck

  build-test:
    name: Compile & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # sbt-dynver needs full history + tags
      - uses: ./.github/actions/setup-scala
      - name: Compile
        run: sbt -batch compile Test/compile
      - name: Scalafix (check) # enforce DisableSyntax / OrganizeImports as a gate
        run: sbt -batch "scalafixAll --check"
      - name: Test with coverage # testcontainers uses the runner's Docker daemon
        run: sbt -batch coverage test coverageReport # coverage reported, not gated (yet)
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scoverage-report
          path: "**/target/scala-*/scoverage-report/**"
          if-no-files-found: warn

  # Secret scanning over the repo + history (static-analysis).
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the full history, not just the tip
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Documentation checklist: referenced files/links resolve and badges point at
  # real workflows (documentation spec).
  docs:
    name: Docs verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify docs
        run: bash scripts/verify-docs.sh

  # sbt-dynver sanity: an untagged commit must yield a snapshot (non-releasable)
  # version so releases can only come from an explicit tag.
  version-check:
    name: Version derivation (dynver)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-scala
      - name: Assert untagged build is a snapshot
        run: |
          VERSION=$(sbt -Dsbt.log.noformat=true -batch -error 'print version' | tail -n1 | perl -pe 's/\e\[[0-9;]*[a-zA-Z]//g' | tr -d '[:space:]')
          echo "Derived version: $VERSION"
          case "$VERSION" in
            *SNAPSHOT*|*-*-*) echo "OK: snapshot version" ;;
            *) echo "ERROR: untagged build produced a clean release version '$VERSION'"; exit 1 ;;
          esac
